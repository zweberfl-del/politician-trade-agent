[project]
name = "politician-trade-agent"
version = "0.1.0"
description = "Discord bot that tracks and mirrors US congressional stock trades"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
trading = ["alpaca-py>=0.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
politician-trade-agent = "src.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
